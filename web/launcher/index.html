<!doctype html>
<meta charset="utf-8">
<title>Fight Night Champion SBS</title>
<style>html,body{margin:0;background:#090b10;color:#e8edf7;font:16px system-ui}main{max-width:1400px;margin:2rem auto;padding:1rem}#stereo-view{display:block;width:100%;height:auto;background:#000;border:1px solid #35465a}#source-video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}button,input{font:inherit;padding:.5rem;margin:.25rem}#status{white-space:pre-wrap;color:#9dd7ff}</style>
<main>
  <h1>Fight Night Champion — SBS session</h1>
  <label>Session <input id="session" pattern="[A-Za-z0-9_-]{6,64}" value="localtest01"></label>
  <button id="connect">Connect</button>
  <button id="fullscreen">Fullscreen</button>
  <video id="source-video" autoplay muted playsinline></video>
  <canvas id="stereo-view" aria-label="Received side-by-side left and right eye frames"></canvas>
  <p id="status">Disconnected. The host must send a packed left|right source frame.</p>
  <p>The client forwards the two halves reported by the host. Eye separation and stereo correctness must come from the native renderer; this page does not create or certify parallax.</p>
</main>
<script type="module" src="./client.js"></script>
